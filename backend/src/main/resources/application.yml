spring:
  application:
    name: fightverse-backend
  datasource:
    url: ${FIGHTVERSE_DB_URL:jdbc:postgresql://localhost:5432/fightverse}
    username: ${FIGHTVERSE_DB_USER:fightverse}
    password: ${FIGHTVERSE_DB_PASSWORD:fightverse}
    hikari:
      maximum-pool-size: ${FIGHTVERSE_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

fightverse:
  security:
    issuer: ${FIGHTVERSE_JWT_ISSUER:fightverse}
    jwt-secret: ${FIGHTVERSE_JWT_SECRET:dev-only-secret-change-me-before-deploying-32}
    access-token-ttl: ${FIGHTVERSE_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${FIGHTVERSE_REFRESH_TOKEN_TTL:P30D}
  web:
    cors-allowed-origins: ${FIGHTVERSE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.fightverse: INFO
